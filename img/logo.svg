<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <filter id="sticker-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#111111" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Grupo Principal con Filtro de Sombra Sticker -->
  <g filter="url(#sticker-shadow)">
    
    <!-- ═════════ PALABRA "LOVE" UNIDA ═════════ -->
    <!-- Letra L -->
    <text x="12" y="58" font-family="'Lilita One', Impact, sans-serif" font-size="52" font-weight="900" fill="#E31E24" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke fill">L</text>
    
    <!-- Icono de Pizza en forma de corazón como letra 'O' (pegado a la L y a VE) -->
    <g transform="translate(39, 14) scale(0.92)">
      <!-- Contorno sticker blanco exterior grueso -->
      <path d="M 22 7 C 12 -4, -4 10, 6 26 C 14 38, 22 46, 22 46 C 22 46, 30 38, 38 26 C 48 10, 32 -4, 22 7 Z" 
            fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
      
      <!-- Corteza de masa dorada de la pizza -->
      <path d="M 22 7 C 12 -4, -4 10, 6 26 C 14 38, 22 46, 22 46 C 22 46, 30 38, 38 26 C 48 10, 32 -4, 22 7 Z" 
            fill="#C68A50" stroke="#8F5826" stroke-width="2" stroke-linejoin="round" />
      
      <!-- Salsa de tomate roja -->
      <path d="M 22 10 C 14 0, 0 12, 8 25 C 15 35, 22 42, 22 42 C 22 42, 29 35, 36 25 C 44 12, 30 0, 22 10 Z" 
            fill="#E31E24" />
      
      <!-- Queso mozzarella fundido amarillo -->
      <path d="M 22 12 C 15 3, 2 13, 9 24 C 15 33, 22 39, 22 39 C 22 39, 29 33, 35 24 C 42 13, 29 3, 22 12 Z" 
            fill="#FFD52A" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 2" />
      
      <!-- Pepperonis pequeños en la pizza -->
      <circle cx="15" cy="18" r="3.2" fill="#E31E24" stroke="#8A1013" stroke-width="1" />
      <circle cx="29" cy="18" r="3.2" fill="#E31E24" stroke="#8A1013" stroke-width="1" />
      <circle cx="22" cy="28" r="3" fill="#E31E24" stroke="#8A1013" stroke-width="1" />
      
      <!-- Albahaca verde fresca -->
      <path d="M 20 19 C 17 16, 21 14, 23 18 Z" fill="#63A83D" />
      
      <!-- Brillo cartoon blanco -->
      <ellipse cx="12" cy="14" rx="2.5" ry="5" transform="rotate(-30 12 14)" fill="#FFFFFF" opacity="0.75" />
    </g>

    <!-- Letras VE (inmediatamente pegadas a la 'O' de pizza para que LOVE esté junto) -->
    <text x="82" y="58" font-family="'Lilita One', Impact, sans-serif" font-size="52" font-weight="900" fill="#E31E24" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke fill">VE</text>
    
    <!-- ═════════ PALABRA "PIZZA" ═════════ -->
    <text x="156" y="58" font-family="'Lilita One', Impact, sans-serif" font-size="52" font-weight="900" fill="#FFD52A" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke fill">PIZZA</text>
  </g>

  <!-- Chispitas de tiza decorativas en esquinas -->
  <circle cx="150" cy="16" r="2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="308" cy="22" r="2.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="6" cy="26" r="1.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
